# Server block for HIMS. The entrypoint runs this through
#   envsubst '${PORT}'
# which substitutes only ${PORT} — every $uri, $query_string and
# $fastcgi_script_name below survives verbatim. Widening that argument list, or
# dropping it, would blank out all of them and serve 404s for the whole app.
server {
    listen ${PORT} default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Render terminates TLS at its edge and forwards over HTTP.
    # bootstrap/app.php already declares trustProxies(at: '*'), which is what
    # makes url()/route() emit https:// rather than the scheme nginx saw.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include       fastcgi_params;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # The AI rail's own timeout is AI_TIMEOUT (30s default) and gap
        # analysis makes more than one provider call, so the default 60s is
        # too tight. Render's edge gives up at 100s regardless.
        fastcgi_read_timeout 120s;
    }

    # Deny dotfiles, but leave /.well-known reachable for ACME and friends.
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
