memory_limit        = 256M
max_execution_time  = 120
upload_max_filesize = 20M
post_max_size       = 20M
expose_php          = Off

; Laravel sets its own timezone from config/app.php (Asia/Manila, which in
; HIMS is an authorization setting — CredentialStatus, CycleStatus and
; ReviewStatus all ask "has this date passed?"). This line only covers PHP's
; own date functions outside the framework, but disagreeing with the app would
; be a trap for whoever reads a log timestamp.
date.timezone = Asia/Manila

; A container's code never changes while it runs, so timestamp validation buys
; nothing. Everything the entrypoint writes (config/route/view caches) is
; written before php-fpm starts.
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000
opcache.validate_timestamps     = 0
