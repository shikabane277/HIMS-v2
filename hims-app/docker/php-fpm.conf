[www]
; php-fpm's own default is clear_env = yes, which strips the worker
; environment — Render's injected variables would be invisible to any runtime
; env() read. The entrypoint runs config:cache so nothing in this app depends
; on that (verified: no env() call outside config/), but a future one might,
; and the failure looks like a database that is simply not configured.
clear_env = no

; Render's smaller instances are memory-bound. pm=dynamic sizes itself from
; the host's CPU count otherwise, which on shared hardware over-commits.
pm                   = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests      = 500

; Send PHP warnings and stack traces to the container log rather than
; swallowing them in a worker nobody reads.
catch_workers_output  = yes
decorate_workers_output = no
